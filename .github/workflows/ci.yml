name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run Node-based actions on Node 24 ahead of the 2026-06-02 forced
  # migration (clears the Node 20 deprecation warning on every CI run).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,interactive]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy src/ont_end_reason || true   # mypy strict starts informational, will be enforced in v0.2.0
        continue-on-error: true

      - name: Run tests
        # Coverage gate ratchets up as analyses fill in:
        #   v0.1.0-alpha: 40% (scaffolds dominant)
        #   v0.2.0-alpha: 62% (actual 63.5%; gate 1pp below to absorb CI variance)
        #   v0.2.0:       69% (actual 70.0%; filter/ exercised with synthetic BAM)
        #   v0.2.0+:      71% (actual 72.0%; figures/ + filter/ parallel paths covered)
        run: pytest --cov=ont_end_reason --cov-report=term-missing --cov-fail-under=71

      - name: Verify CLI entry point
        run: |
          ont-end-reason --version
          ont-end-reason --help
          ont-end-reason codes
          ont-end-reason schema

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        continue-on-error: true
