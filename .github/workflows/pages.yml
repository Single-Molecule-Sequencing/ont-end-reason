# THEME-BEGIN: lab-wiki shared Pages workflow (do not edit between markers)
name: Deploy ont-end-reason front-door to Pages
on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'WIKI.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preflight:
    # Skip the shared Pages workflow entirely if the repo has opted out by
    # checking in a `.no-shared-pages` sentinel file at its root. Repos with
    # their own Pages deploy workflow (e.g. lab-system's deploy-pages.yml)
    # should opt out so they don't race the shared workflow on `concurrency:
    # group: pages`. See lab-wiki issue #43.
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.optout.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      - id: optout
        run: |
          if [ -f .no-shared-pages ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Shared Pages workflow skipped — .no-shared-pages marker present"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Assemble site
        run: |
          mkdir -p _site
          # Copy WIKI.md or docs/wiki/* and the shared theme assets.
          if [ -f WIKI.md ]; then cp WIKI.md _site/index.md; fi
          if [ -d docs/wiki ]; then cp -r docs/wiki/. _site/; fi
          if [ -f docs/lab-theme.css ]; then cp docs/lab-theme.css _site/; fi
          if [ -f docs/lab-nav.html ]; then cp docs/lab-nav.html _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: [preflight, build]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
# THEME-END
