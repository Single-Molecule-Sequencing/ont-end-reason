name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    # PyPI trusted publishing (OIDC, no API token needed).
    # Configure once at https://pypi.org/manage/account/publishing/ binding:
    #   project name: ont-end-reason
    #   owner: Single-Molecule-Sequencing
    #   repo: ont-end-reason
    #   workflow: release.yml
    #   environment: pypi
    environment:
      name: pypi
      url: https://pypi.org/p/ont-end-reason
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
              --title "${GITHUB_REF#refs/tags/}" \
              --generate-notes \
              dist/*
