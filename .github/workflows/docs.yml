name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/ont_end_reason/**"
      - "tests/fixtures/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (interactive extras for chart generation)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[interactive]"

      - name: Regenerate dashboard example outputs
        run: python docs/generate_examples.py

      - name: Stage Pages site
        # docs/ is the GitHub Pages root. Everything under it is served as-is.
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          # Drop the generator script from the published site (it's a build tool, not content)
          rm -f _site/generate_examples.py
          # Add a small no-jekyll marker so files starting with _ are served
          touch _site/.nojekyll
          ls _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
