name: Reproducibility

# Nightly + PR check: confirm that every analysis still produces the
# expected output on the pinned synthetic fixture (and, once activated,
# on the end-reason-paper claim atoms). Catches numeric drift from
# dependency bumps, algorithm changes, or off-by-one regressions.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  pull_request:
    paths:
      - "src/ont_end_reason/**"
      - "tests/fixtures/**"
      - "tests/reproducibility/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/ont_end_reason/**"
      - "tests/fixtures/**"
      - "tests/reproducibility/**"
  workflow_dispatch:

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,interactive]"

      - name: Run fixture reproducibility tests
        run: pytest tests/reproducibility/ -v -m reproducibility

      - name: Diagnose on failure
        if: failure()
        run: |
          echo "::error::Reproducibility drift detected. Either:"
          echo "  (1) A legitimate algorithm/numeric change — regenerate"
          echo "      expected JSON via:"
          echo "      python docs/generate_examples.py && \\"
          echo "      cp docs/examples/json/*.json tests/reproducibility/expected/"
          echo "      Commit with a clear explanation of WHY the output changed."
          echo "  (2) A bug — investigate the failing analysis and fix."
          echo ""
          echo "See tests/reproducibility/test_fixture_reproducibility.py docstring."
